{% extends "base.html" %}
{% block title %}{{ 'Edit' if item else 'Add' }} equipment | EquipTrack{% endblock %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow teal">Administration</p><h1>{{ 'Edit equipment' if item else 'Add equipment' }}</h1><p>Keep inventory details accurate and easy to find.</p></div></div>
<form method="post" class="panel form-card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <div class="form-grid"><label>Asset code<input name="asset_code" maxlength="20" value="{{ item.asset_code if item else '' }}" placeholder="CAM-001" required></label><label>Equipment name<input name="name" maxlength="100" value="{{ item.name if item else '' }}" required></label><label>Category<input name="category" maxlength="50" value="{{ item.category if item else '' }}" placeholder="Cameras" required></label><label>Location<input name="location" maxlength="100" value="{{ item.location if item else '' }}" required></label><label>Total quantity<input type="number" name="total_quantity" min="0" max="999" value="{{ item.total_quantity if item else 1 }}" required></label><label>Condition<select name="condition" required>{% for condition in ['Excellent','Good','Fair','Maintenance'] %}<option {{ 'selected' if item and item.condition == condition }}>{{ condition }}</option>{% endfor %}</select></label></div>
  <label>Description<textarea name="description" maxlength="500" rows="4">{{ item.description if item else '' }}</textarea></label>
  <div class="form-actions"><a class="button ghost" href="{{ url_for('equipment_list') }}">Cancel</a><button class="button primary" type="submit">{{ 'Save changes' if item else 'Add equipment' }}</button></div>
</form>
{% endblock %}
